name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      version_name: ${{ steps.release_meta.outputs.version_name }}
      version_code: ${{ steps.release_meta.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: release_meta
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VER_NAME="${TAG_NAME#v}"
            echo "release_tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version_name=${VER_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version_code=${RUN_NUM}" >> "${GITHUB_OUTPUT}"
          else
            TAG_NAME="v1.0.${RUN_NUM}"
            VER_NAME="1.0.${RUN_NUM}"
            echo "release_tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version_name=${VER_NAME}" >> "${GITHUB_OUTPUT}"
            echo "version_code=${RUN_NUM}" >> "${GITHUB_OUTPUT}"
          fi

  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --build-name=${{ needs.prepare-release.outputs.version_name }} --build-number=${{ needs.prepare-release.outputs.version_code }}

      - name: Rename Android artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/droid-bridge-android-${{ needs.prepare-release.outputs.release_tag }}.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: droid-bridge-android-${{ needs.prepare-release.outputs.release_tag }}
          path: build/app/outputs/flutter-apk/droid-bridge-android-${{ needs.prepare-release.outputs.release_tag }}.apk

  build-macos:
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --build-name=${{ needs.prepare-release.outputs.version_name }} --build-number=${{ needs.prepare-release.outputs.version_code }}

      - name: Zip macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/droid_bridge.app build/macos/Build/Products/Release/droid-bridge-macos-${{ needs.prepare-release.outputs.release_tag }}.zip

      - name: Upload macoS artifact
        uses: actions/upload-artifact@v4
        with:
          name: droid-bridge-macos-${{ needs.prepare-release.outputs.release_tag }}
          path: build/macos/Build/Products/Release/droid-bridge-macos-${{ needs.prepare-release.outputs.release_tag }}.zip

  publish-release:
    needs:
      - prepare-release
      - build-android
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: droid-bridge-android-${{ needs.prepare-release.outputs.release_tag }}
          path: release-assets

      - name: Download macoS artifact
        uses: actions/download-artifact@v4
        with:
          name: droid-bridge-macos-${{ needs.prepare-release.outputs.release_tag }}
          path: release-assets

      - name: Publish Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: Droid Bridge ${{ needs.prepare-release.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/droid-bridge-android-${{ needs.prepare-release.outputs.release_tag }}.apk
            release-assets/droid-bridge-macos-${{ needs.prepare-release.outputs.release_tag }}.zip
